[package]
name = "nauti-fleet"
version = "0.1.0"
edition = "2021"
description = "Fleet-wide telemetry aggregator. Polls every node's nauti-daemon /api/telemetry and exposes one canonical fleet view plus an MCP surface for agents."

[[bin]]
name = "nauti-fleet"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tower-http = { version = "0.6", features = ["fs"] }

